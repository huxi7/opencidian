# [INPUT]: vX.Y.Z 标签、手动版本验证或旧标签重试；内置 GITHUB_TOKEN。
# [OUTPUT]: macOS ARM64、Windows x64、Linux x64 安装包及 SHA256SUMS。
# [POS]: 源码锁定标签提交，发布工具锁定工作流提交；三端全过才公开草稿。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '重试未公开的标签（如 v1.0.0）；留空只验证'
        required: false
        type: string
        default: ''
      validation_tag:
        description: '仅验证时注入的版本（如 v1.0.0）；不移动标签或发布'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: desktop-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      release: ${{ steps.prepare.outputs.release }}
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: prepare
        run: node scripts/release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name) || '' }}
  build:
    needs: prepare
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || inputs.validation_tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: _analysis/release-tools
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select Xcode for native macOS icon
        if: runner.os == 'macOS'
        shell: python
        run: |
          import glob, os, pathlib, plistlib
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              info = plistlib.loads(pathlib.Path(app, 'Contents/Info.plist').read_bytes())
              version = tuple(int(part) for part in info['CFBundleShortVersionString'].split('.'))
              if version[0] >= 26:
                  candidates.append((version, app))
          if not candidates:
              raise SystemExit('Native Icon Composer build requires Xcode 26+')
          version, app = max(candidates)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'DEVELOPER_DIR={app}/Contents/Developer\n')
          print(f'Using Xcode {version}: {app}')
      - name: Verify final icon pixels
        if: hashFiles('scripts/icon-requirements.txt') != ''
        run: |
          python -m pip install -r scripts/icon-requirements.txt
          python scripts/make-app-icon.py --check
      - run: npm ci
      - name: Verify release tools
        working-directory: _analysis/release-tools
        run: node scripts/release.test.mjs && node scripts/release-transaction.test.mjs
      - name: Typecheck, build and test
        run: npm test
      - name: Build installer
        run: npm run dist
      - name: Verify packaged application
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs --no-screenshot
      - name: Verify Linux application in virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs --no-screenshot
      - name: Verify icons inside installer
        if: hashFiles('scripts/verify-packaged-icons.py') != ''
        run: python scripts/verify-packaged-icons.py
      - name: Verify source is unchanged
        run: git diff --exit-code
      - name: Upload verified installer to draft
        if: needs.prepare.outputs.release == 'true'
        run: node _analysis/release-tools/scripts/release.mjs upload ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: _analysis/release-tools
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Publish complete release
        run: node _analysis/release-tools/scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
