# [INPUT]: package.json、dist/、src/、assets/ 与许可证原文。
# [OUTPUT]: release/ 下的目录包与分发产物。
# [POS]: 打包边界配置；ASAR 包含运行文件和许可证。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
appId: app.opensidian
productName: OpenSidian
copyright: Copyright (c) 2026 OpenSidian contributors

directories:
  output: release
  buildResources: build

# 渲染层由 esbuild 打进 dist/；生产依赖由 electron-builder 收集。
# 仓库许可证原文随 ASAR 分发。
files:
  - dist/**
  - src/renderer/*.html
  - src/renderer/styles/**
  - assets/**
  - package.json
  - LICENSE
  - "!**/*.map"

asar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # 本地/开源分发不签名（正式分发需 Apple 开发者证书后再移除本行）
  identity: null
  target:
    - dmg
    - zip

dmg:
  title: OpenSidian
