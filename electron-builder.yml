# [INPUT]: 运行文件、透明晶体图标、原生 Icon Composer 资源与许可证。
# [OUTPUT]: release/ 下的 macOS DMG、Windows EXE 与 Linux AppImage。
# [POS]: 打包边界配置；ASAR 包含运行文件和许可证。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
appId: app.opensidian
productName: OpenSidian
copyright: Copyright (c) 2026 OpenSidian contributors

directories:
  output: release
  buildResources: build

# 渲染层由 esbuild 打进 dist/；生产依赖由 electron-builder 收集。
# 仓库许可证原文随 ASAR 分发。
files:
  - dist/**
  - src/renderer/*.html
  - src/renderer/styles/**
  - assets/**
  - package.json
  - LICENSE
  - "!**/*.map"

asar: true
afterSign: scripts/verify-macos-signature.cjs

mac:
  category: public.app-category.productivity
  icon: build/OpenSidian.icon
  # 无证书时重新封存整个应用，避免残留 Electron 的无效签名。
  identity: '-'
  hardenedRuntime: false
  target:
    - dmg
  artifactName: opensidian-macos-${arch}.${ext}

win:
  icon: build/icon.ico
  target: nsis
  artifactName: opensidian-windows-${arch}.${ext}

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target: AppImage
  icon: build/icon.png
  category: Office
  executableName: opensidian
  artifactName: opensidian-linux-${arch}.${ext}

dmg:
  title: OpenSidian
